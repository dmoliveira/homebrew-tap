<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Homebrew Tap Hero Banner</title>
  <desc id="desc">Abstract banner showing command line tools pouring into a tap glass.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="50%" stop-color="#243b55"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" rx="24"/>
  <circle cx="1030" cy="65" r="120" fill="#ffffff" opacity="0.08"/>
  <circle cx="150" cy="360" r="170" fill="#ffffff" opacity="0.06"/>

  <g fill="#ffffff" opacity="0.15" font-family="Monaco, Menlo, Consolas, monospace" font-size="20">
    <text x="70" y="90">brew tap dmoliveira/tap</text>
    <text x="70" y="120">brew install sk</text>
    <text x="70" y="150">brew install loopmux</text>
    <text x="70" y="180">brew install opencode-tmux-mem</text>
  </g>

  <rect x="650" y="95" width="430" height="16" rx="8" fill="#d9d9d9"/>
  <rect x="1020" y="80" width="42" height="46" rx="8" fill="#d9d9d9"/>
  <rect x="965" y="111" width="82" height="16" rx="8" fill="#d9d9d9"/>

  <rect x="880" y="145" width="42" height="120" rx="20" fill="url(#amber)" opacity="0.9"/>
  <circle cx="901" cy="275" r="9" fill="#ffd166" opacity="0.8"/>
  <circle cx="901" cy="297" r="6" fill="#ffd166" opacity="0.7"/>
  <circle cx="901" cy="314" r="4" fill="#ffd166" opacity="0.6"/>

  <rect x="740" y="230" width="130" height="120" rx="18" fill="#f1f1f1" opacity="0.94"/>
  <rect x="752" y="250" width="106" height="80" rx="10" fill="url(#amber)" opacity="0.96"/>
  <rect x="730" y="220" width="18" height="110" rx="8" fill="#f1f1f1" opacity="0.94"/>

  <text x="70" y="285" fill="#ffffff" font-family="Avenir Next, Futura, Trebuchet MS, sans-serif" font-size="52" font-weight="700">Homebrew Tap</text>
  <text x="70" y="330" fill="#ffd166" font-family="Avenir Next, Futura, Trebuchet MS, sans-serif" font-size="28">Fast installs for custom CLI tools</text>
</svg>

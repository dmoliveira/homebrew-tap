<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homebrew Tap Docs</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f8f7;
        --card: #ffffff;
        --text: #1b2b2a;
        --muted: #4c6160;
        --accent: #0f766e;
      }
      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top right, #d7f2ee 0%, var(--bg) 45%);
        color: var(--text);
      }
      main {
        max-width: 860px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid #d9e7e5;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(19, 42, 39, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
      }
      p {
        color: var(--muted);
      }
      ul {
        padding-left: 18px;
      }
      li {
        margin: 8px 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      .cta {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">

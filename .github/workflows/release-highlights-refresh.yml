name: Refresh sk Release Highlights

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh highlights block
        run: ./scripts/update-sk-release-highlights.sh 3

      - name: Create pull request when highlights change
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: refresh sk release highlights"
          branch: bot/refresh-sk-release-highlights
          delete-branch: true
          title: "docs: refresh sk release highlights"
          body: |
            ## Summary
            - refresh the marker-managed `Recent sk Release Highlights` block in `README.md`
            - generated by the scheduled workflow using `scripts/update-sk-release-highlights.sh`

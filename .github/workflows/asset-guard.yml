name: Hero Asset Guard

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1"

jobs:
  hero-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate hero assets
        run: ./scripts/check-hero-asset.sh

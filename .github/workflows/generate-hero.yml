name: Generate README Hero

on:
  workflow_dispatch:
    inputs:
      image_model:
        description: "OpenAI image model"
        required: false
        default: "gpt-image-1.5"
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secret availability
        id: secret_check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Missing OPENAI_API_KEY repository secret. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "OPENAI_API_KEY missing for scheduled run; skipping hero generation."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Generate hero image
        if: steps.secret_check.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ inputs.image_model || 'gpt-image-1.5' }}
        run: ./scripts/generate-hero-gpt-image.sh

      - name: Upload hero image artifact
        if: steps.secret_check.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-tap-hero
          path: docs/assets/homebrew-tap-hero.webp
